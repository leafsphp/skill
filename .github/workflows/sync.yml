name: Sync skill from leafphp.dev

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Pull SKILL.md and references from leafsphp/docs
        run: bash scripts/sync.sh
      - name: Commit if anything changed
        run: |
          git config user.name "leaf-bot"
          git config user.email "bot@leafphp.dev"
          git add SKILL.md references
          git diff --cached --quiet && exit 0
          git commit -m "chore: sync skill from leafphp.dev"
          git push
