name: Run the auth example

on:
  push:
  pull_request:
  schedule:
    - cron: "41 6 * * 1"

jobs:
  auth-api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: pdo_sqlite, sqlite3
      - name: Install
        working-directory: examples/auth-api
        run: composer install --no-interaction --prefer-dist
      - name: Register, log in, hit the protected route
        working-directory: examples/auth-api
        run: |
          bash smoke.sh | tee out.txt
          grep -q '"accessToken"' out.txt
          grep -q '401 Unauthorized' out.txt
          grep -q '"email":"ada@example.com"' out.txt
